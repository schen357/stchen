[project]
name = "rag_sources"
version = "0.1.0"
description = "rag retrieval code"
readme = "README.md"
requires-python = ">=3.11, <=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "sentence-transformers>=6.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
